name: Studio

on:
  push:
    paths:
      - "studio/**"
      - "tools/jev/**"
      - ".github/workflows/studio.yml"
  pull_request:
    paths:
      - "studio/**"
      - "tools/jev/**"
      - ".github/workflows/studio.yml"

permissions:
  contents: read

concurrency:
  group: studio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  studio:
    name: Typecheck, lint, test, build, e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: studio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/studio_test
      E2E_DATABASE_URL: postgres://postgres@localhost:5432/studio_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: studio/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm models
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          HF_API_BASE_URL: https://api.higgsfield.ai
      - run: pnpm exec playwright install --with-deps chromium
      # Magic links go to the email_outbox table (EMAIL_TRANSPORT=outbox); nothing is emailed.
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: studio/test-results
          retention-days: 7

  jev-tools:
    name: JEV tooling unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/jev
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --no-project --with "ruff>=0.14,<1" ruff check .
      # Pure modules only: JEV itself, Chrome and API keys are never used in CI.
      - run: uv run --no-project --with "pytest>=8.4,<9" pytest
        env:
          PYTHONPATH: .
